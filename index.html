#include <stdio.h>

/* Linear search: works on any list */
int linearSearch(int a[], int n, int key) {
    for (int i = 0; i < n; i++) {
        if (a[i] == key)
            return i;
    }
    return -1;
}

/* Binary search: list must be sorted in ascending order */
int binarySearch(int a[], int n, int key) {
    int low = 0, high = n - 1;
    while (low <= high) {
        int mid = (low + high) / 2;
        if (a[mid] == key)
            return mid;
        else if (a[mid] < key)
            low = mid + 1;
        else
            high = mid - 1;
    }
    return -1;
}

int main() {
    int roll[100], n, key, choice, pos;

    printf("Enter number of students: ");
    scanf("%d", &n);
    printf("Enter %d roll numbers (ascending order for binary search):\n", n);
    for (int i = 0; i < n; i++)
        scanf("%d", &roll[i]);

    do {
        printf("\n--- MENU ---\n");
        printf("1. Linear Search\n2. Binary Search\n3. Exit\n");
        printf("Enter your choice: ");
        scanf("%d", &choice);

        if (choice == 1 || choice == 2) {
            printf("Enter roll number to search: ");
            scanf("%d", &key);
            pos = (choice == 1) ? linearSearch(roll, n, key)
                                : binarySearch(roll, n, key);
            if (pos == -1)
                printf("Roll number %d not found.\n", key);
            else
                printf("Roll number %d found at position %d.\n", key, pos + 1);
        } else if (choice != 3) {
            printf("Invalid choice!\n");
        }
    } while (choice != 3);

    return 0;
}
</script>

<script type="text/plain" id="src-2">
#include <stdio.h>

void display(float a[], int n) {
    for (int i = 0; i < n; i++)
        printf("%.2f  ", a[i]);
    printf("\n");
}

/* Selection sort: ascending order */
void selectionSort(float a[], int n) {
    for (int i = 0; i < n - 1; i++) {
        int min = i;
        for (int j = i + 1; j < n; j++) {
            if (a[j] < a[min])
                min = j;
        }
        float temp = a[i];
        a[i] = a[min];
        a[min] = temp;
    }
}

/* Bubble sort: descending order */
void bubbleSort(float a[], int n) {
    for (int i = 0; i < n - 1; i++) {
        for (int j = 0; j < n - i - 1; j++) {
            if (a[j] < a[j + 1]) {
                float temp = a[j];
                a[j] = a[j + 1];
                a[j + 1] = temp;
            }
        }
    }
}

int main() {
    float orig[100], a[100];
    int n, choice;

    printf("Enter number of students: ");
    scanf("%d", &n);
    printf("Enter percentage of each student:\n");
    for (int i = 0; i < n; i++)
        scanf("%f", &orig[i]);

    do {
        for (int i = 0; i < n; i++)
            a[i] = orig[i];     /* sort a fresh copy each time */

        printf("\n--- MENU ---\n");
        printf("1. Selection Sort (ascending)\n");
        printf("2. Bubble Sort (descending)\n");
        printf("3. Exit\n");
        printf("Enter your choice: ");
        scanf("%d", &choice);

        switch (choice) {
            case 1:
                selectionSort(a, n);
                printf("Sorted percentages:\n");
                display(a, n);
                break;
            case 2:
                bubbleSort(a, n);
                printf("Sorted percentages:\n");
                display(a, n);
                break;
            case 3:
                break;
            default:
                printf("Invalid choice!\n");
        }
    } while (choice != 3);

    return 0;
}
</script>

<script type="text/plain" id="src-3">
#include <stdio.h>
#include <string.h>

#define SIZE 11          /* prime size so double hashing can reach every slot */
#define EMPTY -1

struct Record {
    long long phone;
    char name[30];
};

struct Record table[SIZE];

int h1(long long key) { return key % SIZE; }
int h2(long long key) { return 7 - (key % 7); }

void init() {
    for (int i = 0; i < SIZE; i++) {
        table[i].phone = EMPTY;
        strcpy(table[i].name, "");
    }
}

/* mode 1 = linear probing, mode 2 = double hashing */
int insert(long long phone, char name[], int mode) {
    int idx = h1(phone);
    int step = (mode == 1) ? 1 : h2(phone);

    for (int i = 0; i < SIZE; i++) {
        int pos = (idx + i * step) % SIZE;
        if (table[pos].phone == EMPTY) {
            table[pos].phone = phone;
            strcpy(table[pos].name, name);
            return pos;
        }
    }
    return -1;   /* table full */
}

int search(long long phone, int mode, int *comparisons) {
    int idx = h1(phone);
    int step = (mode == 1) ? 1 : h2(phone);
    *comparisons = 0;

    for (int i = 0; i < SIZE; i++) {
        int pos = (idx + i * step) % SIZE;
        (*comparisons)++;
        if (table[pos].phone == EMPTY)
            return -1;
        if (table[pos].phone == phone)
            return pos;
    }
    return -1;
}

void display() {
    printf("\nIndex  Phone Number   Name\n");
    for (int i = 0; i < SIZE; i++) {
        if (table[i].phone == EMPTY)
            printf("%3d    ---\n", i);
        else
            printf("%3d    %-13lld  %s\n", i, table[i].phone, table[i].name);
    }
}

int main() {
    int mode, choice, pos, comp;
    long long phone;
    char name[30];

    init();
    printf("Collision handling method\n1. Linear Probing\n2. Double Hashing\nChoice: ");
    scanf("%d", &mode);

    do {
        printf("\n--- TELEPHONE BOOK ---\n");
        printf("1. Insert\n2. Search\n3. Display\n4. Exit\n");
        printf("Enter your choice: ");
        scanf("%d", &choice);

        switch (choice) {
            case 1:
                printf("Enter name: ");
                scanf("%s", name);
                printf("Enter phone number: ");
                scanf("%lld", &phone);
                pos = insert(phone, name, mode);
                if (pos == -1)
                    printf("Table is full!\n");
                else
                    printf("Stored at index %d\n", pos);
                break;
            case 2:
                printf("Enter phone number to search: ");
                scanf("%lld", &phone);
                pos = search(phone, mode, &comp);
                if (pos == -1)
                    printf("Not found (%d comparisons).\n", comp);
                else
                    printf("Found: %s at index %d (%d comparisons).\n",
                           table[pos].name, pos, comp);
                break;
            case 3:
                display();
                break;
            case 4:
                break;
            default:
                printf("Invalid choice!\n");
        }
    } while (choice != 4);

    return 0;
}
</script>

<script type="text/plain" id="src-4">
#include <stdio.h>
#include <stdlib.h>
#include <string.h>

struct Member {
    int prn;
    char name[30];
    struct Member *next;
};

struct Member *head = NULL;

struct Member *createNode() {
    struct Member *p = (struct Member *)malloc(sizeof(struct Member));
    printf("Enter PRN: ");
    scanf("%d", &p->prn);
    printf("Enter name: ");
    scanf("%s", p->name);
    p->next = NULL;
    return p;
}

/* President is always the first node */
void addPresident() {
    struct Member *p = createNode();
    p->next = head;
    head = p;
}

/* Secretary is always the last node */
void addSecretary() {
    struct Member *p = createNode();
    if (head == NULL) {
        head = p;
        return;
    }
    struct Member *t = head;
    while (t->next != NULL)
        t = t->next;
    t->next = p;
}

/* Ordinary member is added after the president */
void addMember() {
    struct Member *p = createNode();
    if (head == NULL) {
        head = p;
        return;
    }
    p->next = head->next;
    head->next = p;
}

void deleteMember(int prn) {
    struct Member *t = head, *prev = NULL;
    while (t != NULL && t->prn != prn) {
        prev = t;
        t = t->next;
    }
    if (t == NULL) {
        printf("Member not found.\n");
        return;
    }
    if (prev == NULL)
        head = t->next;
    else
        prev->next = t->next;
    free(t);
    printf("Member deleted.\n");
}

void display() {
    struct Member *t = head;
    if (t == NULL) {
        printf("List is empty.\n");
        return;
    }
    printf("\nPRN     Name\n");
    while (t != NULL) {
        printf("%-7d %s\n", t->prn, t->name);
        t = t->next;
    }
}

int count() {
    int c = 0;
    for (struct Member *t = head; t != NULL; t = t->next)
        c++;
    return c;
}

void reverse() {
    struct Member *prev = NULL, *cur = head, *next;
    while (cur != NULL) {
        next = cur->next;
        cur->next = prev;
        prev = cur;
        cur = next;
    }
    head = prev;
}

int main() {
    int choice, prn;
    do {
        printf("\n--- PINNACLE CLUB ---\n");
        printf("1. Add President\n2. Add Secretary\n3. Add Member\n");
        printf("4. Delete Member\n5. Display\n6. Count Members\n");
        printf("7. Reverse List\n8. Exit\n");
        printf("Enter your choice: ");
        scanf("%d", &choice);

        switch (choice) {
            case 1: addPresident(); break;
            case 2: addSecretary(); break;
            case 3: addMember(); break;
            case 4:
                printf("Enter PRN to delete: ");
                scanf("%d", &prn);
                deleteMember(prn);
                break;
            case 5: display(); break;
            case 6: printf("Total members: %d\n", count()); break;
            case 7: reverse(); printf("List reversed.\n"); break;
            case 8: break;
            default: printf("Invalid choice!\n");
        }
    } while (choice != 8);

    return 0;
}
</script>

<script type="text/plain" id="src-5">
#include <stdio.h>
#include <stdlib.h>
#include <string.h>

#define TOTAL_SEATS 20
#define SEATS_PER_ROW 5

struct Seat {
    int no;
    int booked;
    char name[30];
    struct Seat *prev, *next;
};

struct Seat *head = NULL, *tail = NULL;

/* Build a doubly linked list with one node per seat */
void createSeats() {
    for (int i = 1; i <= TOTAL_SEATS; i++) {
        struct Seat *p = (struct Seat *)malloc(sizeof(struct Seat));
        p->no = i;
        p->booked = 0;
        strcpy(p->name, "");
        p->next = NULL;
        p->prev = tail;
        if (tail == NULL)
            head = p;
        else
            tail->next = p;
        tail = p;
    }
}

struct Seat *findSeat(int no) {
    for (struct Seat *t = head; t != NULL; t = t->next)
        if (t->no == no)
            return t;
    return NULL;
}

void bookSeat() {
    int no;
    printf("Enter seat number to book (1-%d): ", TOTAL_SEATS);
    scanf("%d", &no);
    struct Seat *s = findSeat(no);
    if (s == NULL)
        printf("Invalid seat number.\n");
    else if (s->booked)
        printf("Seat %d is already booked by %s.\n", no, s->name);
    else {
        printf("Enter customer name: ");
        scanf("%s", s->name);
        s->booked = 1;
        printf("Seat %d booked for %s.\n", no, s->name);
    }
}

void cancelSeat() {
    int no;
    printf("Enter seat number to cancel: ");
    scanf("%d", &no);
    struct Seat *s = findSeat(no);
    if (s == NULL)
        printf("Invalid seat number.\n");
    else if (!s->booked)
        printf("Seat %d is not booked.\n", no);
    else {
        s->booked = 0;
        strcpy(s->name, "");
        printf("Booking for seat %d cancelled.\n", no);
    }
}

/* Forward traversal: seat map ([XX] = booked) */
void displaySeats() {
    printf("\n          SCREEN THIS WAY\n\n");
    int col = 0;
    for (struct Seat *t = head; t != NULL; t = t->next) {
        if (t->booked)
            printf("[XX] ");
        else
            printf("[%02d] ", t->no);
        if (++col == SEATS_PER_ROW) {
            printf("\n");
            col = 0;
        }
    }
}

/* Backward traversal using prev pointers */
void displayBookedReverse() {
    int found = 0;
    printf("\nBooked seats (last to first):\n");
    for (struct Seat *t = tail; t != NULL; t = t->prev) {
        if (t->booked) {
            printf("Seat %02d - %s\n", t->no, t->name);
            found = 1;
        }
    }
    if (!found)
        printf("No seats booked yet.\n");
}

int availableCount() {
    int c = 0;
    for (struct Seat *t = head; t != NULL; t = t->next)
        if (!t->booked)
            c++;
    return c;
}

int main() {
    int choice;
    createSeats();

    do {
        printf("\n--- THEATER TICKET BOOKING ---\n");
        printf("1. Book Seat\n2. Cancel Booking\n3. Display Seats\n");
        printf("4. Booked Seats (reverse)\n5. Available Seats Count\n6. Exit\n");
        printf("Enter your choice: ");
        scanf("%d", &choice);

        switch (choice) {
            case 1: bookSeat(); break;
            case 2: cancelSeat(); break;
            case 3: displaySeats(); break;
            case 4: displayBookedReverse(); break;
            case 5: printf("Available seats: %d\n", availableCount()); break;
            case 6: break;
            default: printf("Invalid choice!\n");
        }
    } while (choice != 6);

    return 0;
}
</script>

<script type="text/plain" id="src-6">
#include <stdio.h>
#include <string.h>

#define MAX 100

char stack[MAX];
int top = -1;

void push(char c) {
    stack[++top] = c;
}

char pop() {
    return stack[top--];
}

int isEmpty() {
    return top == -1;
}

int isMatching(char open, char close) {
    return (open == '(' && close == ')') ||
           (open == '{' && close == '}') ||
           (open == '[' && close == ']');
}

/* Returns 1 if every bracket is opened and closed in the right order */
int isParenthesized(char exp[]) {
    top = -1;
    for (int i = 0; exp[i] != '\0'; i++) {
        char c = exp[i];
        if (c == '(' || c == '{' || c == '[') {
            push(c);
        } else if (c == ')' || c == '}' || c == ']') {
            if (isEmpty())
                return 0;               /* closing bracket with no opening */
            if (!isMatching(pop(), c))
                return 0;               /* wrong type of bracket */
        }
    }
    return isEmpty();                   /* leftover opening brackets */
}

int main() {
    char exp[MAX];
    char again;

    do {
        printf("Enter an expression: ");
        scanf(" %[^\n]", exp);

        if (isParenthesized(exp))
            printf("The expression is well parenthesized.\n");
        else
            printf("The expression is NOT well parenthesized.\n");

        printf("Check another expression? (y/n): ");
        scanf(" %c", &again);
    } while (again == 'y' || again == 'Y');

    return 0;
}
</script>

<script type="text/plain" id="src-7">
#include <stdio.h>

#define MAX 5

/* Circular queue so freed slots are reused */
struct Job {
    int id;
    char name[30];
};

struct Job queue[MAX];
int front = -1, rear = -1;

int isFull() {
    return (rear + 1) % MAX == front;
}

int isEmpty() {
    return front == -1;
}

void addJob() {
    if (isFull()) {
        printf("Job queue is full!\n");
        return;
    }
    struct Job j;
    printf("Enter job id: ");
    scanf("%d", &j.id);
    printf("Enter job name: ");
    scanf("%s", j.name);

    if (isEmpty())
        front = 0;
    rear = (rear + 1) % MAX;
    queue[rear] = j;
    printf("Job %d added to the queue.\n", j.id);
}

void processJob() {
    if (isEmpty()) {
        printf("No jobs to process.\n");
        return;
    }
    printf("Processing job %d (%s)... done.\n",
           queue[front].id, queue[front].name);
    if (front == rear)
        front = rear = -1;              /* queue became empty */
    else
        front = (front + 1) % MAX;
}

void displayJobs() {
    if (isEmpty()) {
        printf("Job queue is empty.\n");
        return;
    }
    printf("\nJobs waiting (front to rear):\n");
    int i = front;
    while (1) {
        printf("Job %d - %s\n", queue[i].id, queue[i].name);
        if (i == rear)
            break;
        i = (i + 1) % MAX;
    }
}

int main() {
    int choice;
    do {
        printf("\n--- JOB QUEUE SIMULATION ---\n");
        printf("1. Add Job\n2. Process Job\n3. Display Jobs\n4. Exit\n");
        printf("Enter your choice: ");
        scanf("%d", &choice);

        switch (choice) {
            case 1: addJob(); break;
            case 2: processJob(); break;
            case 3: displayJobs(); break;
            case 4: break;
            default: printf("Invalid choice!\n");
        }
    } while (choice != 4);

    return 0;
}
</script>

<script type="text/plain" id="src-8">
#include <stdio.h>
#include <stdlib.h>

struct Node {
    int data;
    struct Node *left, *right;
};

struct Node *newNode(int value) {
    struct Node *n = (struct Node *)malloc(sizeof(struct Node));
    n->data = value;
    n->left = n->right = NULL;
    return n;
}

struct Node *insert(struct Node *root, int value) {
    if (root == NULL)
        return newNode(value);
    if (value < root->data)
        root->left = insert(root->left, value);
    else if (value > root->data)
        root->right = insert(root->right, value);
    else
        printf("%d already exists, duplicate ignored.\n", value);
    return root;
}

/* Number of nodes on the longest root-to-leaf path */
int longestPath(struct Node *root) {
    if (root == NULL)
        return 0;
    int l = longestPath(root->left);
    int r = longestPath(root->right);
    return (l > r ? l : r) + 1;
}

/* Minimum value is the leftmost node */
int findMin(struct Node *root) {
    while (root->left != NULL)
        root = root->left;
    return root->data;
}

void inorder(struct Node *root) {
    if (root != NULL) {
        inorder(root->left);
        printf("%d ", root->data);
        inorder(root->right);
    }
}

int main() {
    struct Node *root = NULL;
    int choice, value;

    do {
        printf("\n--- BINARY SEARCH TREE ---\n");
        printf("1. Insert\n2. Count Nodes in Longest Path\n");
        printf("3. Find Minimum Value\n4. Display (Inorder)\n5. Exit\n");
        printf("Enter your choice: ");
        scanf("%d", &choice);

        switch (choice) {
            case 1:
                printf("Enter value to insert: ");
                scanf("%d", &value);
                root = insert(root, value);
                break;
            case 2:
                if (root == NULL)
                    printf("Tree is empty.\n");
                else
                    printf("Nodes in longest path: %d\n", longestPath(root));
                break;
            case 3:
                if (root == NULL)
                    printf("Tree is empty.\n");
                else
                    printf("Minimum value: %d\n", findMin(root));
                break;
            case 4:
                if (root == NULL)
                    printf("Tree is empty.\n");
                else {
                    printf("Inorder: ");
                    inorder(root);
                    printf("\n");
                }
                break;
            case 5:
                break;
            default:
                printf("Invalid choice!\n");
        }
    } while (choice != 5);

    return 0;
}
</script>

<script type="text/plain" id="src-9">
#include <stdio.h>
#include <string.h>

#define MAX 10

char city[MAX][30];
int adj[MAX][MAX];      /* adjacency matrix: 1 = flight exists */
int visited[MAX];
int n = 0;              /* number of cities */

int findCity(char name[]) {
    for (int i = 0; i < n; i++)
        if (strcmp(city[i], name) == 0)
            return i;
    return -1;
}

void addCity() {
    if (n == MAX) {
        printf("Maximum cities reached.\n");
        return;
    }
    printf("Enter city name: ");
    scanf("%s", city[n]);
    n++;
}

/* Flights run both ways, so the graph is undirected */
void addFlight() {
    char a[30], b[30];
    printf("From city: ");
    scanf("%s", a);
    printf("To city: ");
    scanf("%s", b);
    int i = findCity(a), j = findCity(b);
    if (i == -1 || j == -1) {
        printf("City not found. Add the city first.\n");
        return;
    }
    adj[i][j] = adj[j][i] = 1;
    printf("Flight added between %s and %s.\n", a, b);
}

void display() {
    printf("\n%-12s", "");
    for (int i = 0; i < n; i++)
        printf("%-10.9s", city[i]);
    printf("\n");
    for (int i = 0; i < n; i++) {
        printf("%-12.11s", city[i]);
        for (int j = 0; j < n; j++)
            printf("%-10d", adj[i][j]);
        printf("\n");
    }
}

void dfs(int v) {
    visited[v] = 1;
    for (int i = 0; i < n; i++)
        if (adj[v][i] && !visited[i])
            dfs(i);
}

/* Graph is connected if DFS from one city reaches every city */
void checkConnected() {
    if (n == 0) {
        printf("No cities added.\n");
        return;
    }
    for (int i = 0; i < n; i++)
        visited[i] = 0;
    dfs(0);
    for (int i = 0; i < n; i++) {
        if (!visited[i]) {
            printf("The graph is NOT connected (%s cannot be reached from %s).\n",
                   city[i], city[0]);
            return;
        }
    }
    printf("The graph is connected: every city can be reached from every other city.\n");
}

int main() {
    int choice;
    do {
        printf("\n--- FLIGHT PATHS ---\n");
        printf("1. Add City\n2. Add Flight\n3. Display Adjacency Matrix\n");
        printf("4. Check Connectivity\n5. Exit\n");
        printf("Enter your choice: ");
        scanf("%d", &choice);

        switch (choice) {
            case 1: addCity(); break;
            case 2: addFlight(); break;
            case 3: display(); break;
            case 4: checkConnected(); break;
            case 5: break;
            default: printf("Invalid choice!\n");
        }
    } while (choice != 5);

    return 0;
}
</script>

var KW = "int|char|float|double|long|void|struct|return|if|else|for|while|do|switch|case|break|default|sizeof|NULL|define|include";
var RE = new RegExp("(\\/\\/.*|\\/\\*[\\s\\S]*?\\*\\/)|(\"(?:\\\\.|[^\"\\\\])*\"|'(?:\\\\.|[^'\\\\])*')|(^#\\w+)|\\b(" + KW + ")\\b|\\b(\\d+)\\b", "gm");

function highlight(code) {
  var esc = code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc.replace(RE, function (m, com, str, pre, kw, num) {
    if (com) return '<span class="c">' + m + "</span>";
    if (str) return '<span class="s">' + m + "</span>";
    if (pre) return '<span class="p">' + m + "</span>";
    if (kw) return '<span class="k">' + m + "</span>";
    if (num) return '<span class="d">' + m + "</span>";
    return m;
  });
}

var view = document.getElementById("view");

});

function current() {
  var m = /^#practical-(\d)$/.exec(location.hash);
  var i = m ? parseInt(m[1], 10) - 1 : 0;

function render() {

function copyCode(text, btn) {
  function done(ok) {
    btn.textContent = ok ? "Copied" : "Press Ctrl+C";
    setTimeout(function () { btn.textContent = "Copy code"; }, 1800);
  }
  function fallback() {
    var sel = window.getSelection(), r = document.createRange();
    r.selectNodeContents(view.querySelector("code"));
    sel.removeAllRanges(); sel.addRange(r);
    done(false);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
  } else fallback();
}

window.addEventListener("hashchange", function () { render(); window.scrollTo(0, 0); });
